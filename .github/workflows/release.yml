name: Release InfoSET

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0
      notes:
        description: Release notes
        required: false
        default: First independently signed InfoSET release.

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      INFOSET_KEY_ALIAS: ${{ secrets.INFOSET_KEY_ALIAS }}
      INFOSET_KEY_PASSWORD: ${{ secrets.INFOSET_KEY_PASSWORD }}
      INFOSET_STORE_PASSWORD: ${{ secrets.INFOSET_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare version metadata
        run: |
          echo "INFOSET_VERSION_CODE=$(( $(git show -s --format=%ct) / 2 ))" >> "$GITHUB_ENV"
          echo "INFOSET_VERSION_NAME=${{ inputs.tag }}" | sed 's/INFOSET_VERSION_NAME=v/INFOSET_VERSION_NAME=/' >> "$GITHUB_ENV"

      - name: Restore release keystore
        env:
          INFOSET_KEYSTORE_BASE64: ${{ secrets.INFOSET_KEYSTORE_BASE64 }}
        run: |
          test -n "$INFOSET_KEYSTORE_BASE64"
          printf '%s' "$INFOSET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/infoset-release.p12"
          echo "INFOSET_KEYSTORE_PATH=$RUNNER_TEMP/infoset-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Verify APK signatures
        run: |
          for apk in app/build/outputs/apk/github/release/*.apk; do
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
              verify --verbose --print-certs "$apk"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/github/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "InfoSET ${RELEASE_TAG#v}" \
            --notes "$RELEASE_NOTES"
