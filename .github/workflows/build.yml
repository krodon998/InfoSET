name: Build InfoSET

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"
      - "release-assets/**"
      - ".gitignore"
      - "scripts/setup-release-signing.ps1"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tests_only:
        description: Run verification without producing an APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-infoset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare version metadata
        run: |
          echo "INFOSET_VERSION_CODE=$(( $(git show -s --format=%ct) / 2 ))" >> "$GITHUB_ENV"
          echo "INFOSET_VERSION_NAME=0.1.0-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test InfoSET shell and mailbox
        run: |
          chmod +x gradlew
          ./gradlew testGithubDebugUnitTest \
            --tests me.rerere.rikkahub.ui.context.NavigatorTest \
            --tests me.rerere.rikkahub.data.ai.tools.local.MailboxToolTest \
            --tests me.rerere.rikkahub.data.gifts.DelayedBoxImporterTest \
            --tests me.rerere.rikkahub.data.gifts.MonthlyLifeLettersImporterTest \
            --tests me.rerere.rikkahub.ui.pages.setting.SettingCatalogTest \
            --tests me.rerere.rikkahub.ui.pages.setting.InfoOsSettingsTest \
            --tests me.rerere.rikkahub.data.ai.ContextComposerTest \
            --tests me.rerere.rikkahub.data.ai.AtomicMemoryRecallEngineTest \
            --tests me.rerere.rikkahub.data.repository.MarkdownMemoryImporterTest \
            --tests me.rerere.rikkahub.data.ai.UsageRecorderTest \
            --tests me.rerere.rikkahub.data.model.ConversationConfigTest \
            --tests me.rerere.rikkahub.data.model.ConversationForkTest \
            --tests me.rerere.rikkahub.data.model.ConversationMessagesTest \
            --tests me.rerere.rikkahub.data.model.AssistantSettingsPolicyTest \
            --tests me.rerere.rikkahub.data.search.ArchiveBrowserTest \
            --tests me.rerere.rikkahub.data.model.StickerMessageLifecycleTest \
            --tests me.rerere.rikkahub.data.sync.BackupAttachmentFoldersTest \
            --tests me.rerere.rikkahub.data.ai.transformers.ReplyReferenceTransformerTest \
            --tests me.rerere.rikkahub.service.ConversationInboxTest \
            --tests me.rerere.rikkahub.service.QueuedAttachmentCleanupTest \
            --tests me.rerere.rikkahub.ui.hooks.ChatInputStateTest \
            --tests me.rerere.rikkahub.ui.components.ai.ChatInputHoldTargetTest \
            --tests me.rerere.rikkahub.data.ai.account.ChatGPTAuthTest \
            --tests me.rerere.rikkahub.data.ai.account.GitHubAuthTest \
            --tests me.rerere.rikkahub.data.ai.account.GitHubCredentialVaultTest \
            --tests me.rerere.rikkahub.data.ai.account.ProviderCredentialVaultTest \
            --tests me.rerere.rikkahub.data.ai.account.GitHubAccountUiPolicyTest \
            --tests me.rerere.rikkahub.data.repository.ActivityAnalyticsTest \
            --tests me.rerere.rikkahub.data.ai.account.ProviderAccountManagerTest \
            --tests me.rerere.rikkahub.ui.pages.home.DaddyAuditLabelsTest \
            --tests me.rerere.rikkahub.ui.pages.setting.components.ProviderConfigureConvertToTest \
            --tests me.rerere.rikkahub.ui.components.message.tools.MailboxToolUITest
          ./gradlew :ai:testDebugUnitTest \
            --tests me.rerere.ai.core.UsageCostTest \
            --tests me.rerere.ai.ui.UIMessageSerializationTest \
            --tests me.rerere.ai.provider.providers.openai.ChatCompletionsUsageParsingTest \
            --tests me.rerere.ai.provider.providers.chatgpt.ChatGPTProviderTest \
            --tests me.rerere.ai.provider.QuotaQueryRunnerTest
          ./gradlew :oauth:testDebugUnitTest \
            --tests me.rerere.oauth.OAuthLoopbackCallbackServerTest
          ./gradlew assembleGithubDebugAndroidTest

      - name: Verify Room schema
        run: |
          test -f app/schemas/me.rerere.rikkahub.data.db.AppDatabase/40.json
          git diff --exit-code -- app/schemas/me.rerere.rikkahub.data.db.AppDatabase/40.json

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v40
          path: app/schemas/me.rerere.rikkahub.data.db.AppDatabase/40.json
          if-no-files-found: error
          retention-days: 3

      - name: Build APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tests_only != true)
        env:
          INFOSET_KEYSTORE_BASE64: ${{ secrets.INFOSET_KEYSTORE_BASE64 }}
          INFOSET_KEY_ALIAS: ${{ secrets.INFOSET_KEY_ALIAS }}
          INFOSET_KEY_PASSWORD: ${{ secrets.INFOSET_KEY_PASSWORD }}
          INFOSET_STORE_PASSWORD: ${{ secrets.INFOSET_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          test -n "$INFOSET_KEYSTORE_BASE64"
          printf '%s' "$INFOSET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/infoset-release.p12"
          export INFOSET_KEYSTORE_PATH="$RUNNER_TEMP/infoset-release.p12"
          ./gradlew assembleGithubPreview
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in app/build/outputs/apk/github/preview/*.apk; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            "$build_tools/aapt" dump badging "$apk" \
              | grep -F "package: name='com.infoset.app' versionCode='$INFOSET_VERSION_CODE'"
          done

      - name: Upload APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tests_only != true)
        uses: actions/upload-artifact@v4
        with:
          name: InfoSET-signed-preview
          path: app/build/outputs/apk/github/preview/*universal*.apk
          if-no-files-found: error
          retention-days: 3

  memory-instrumentation:
    name: memory instrumentation
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run memory migration and restore tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: >-
            ./gradlew connectedGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.data.memory.MemoryInstrumentationSuite

      - name: Verify memory instrumentation result
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("memory instrumentation produced no XML report")

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ElementTree.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          print("memory instrumentation:", ", ".join(f"{key}={value}" for key, value in totals.items()))
          if totals != {"tests": 18, "failures": 0, "errors": 0, "skipped": 0}:
              raise SystemExit("memory instrumentation did not execute the complete green suite")
          PY

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

