name: Build InfoSET

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"
      - "release-assets/**"
      - ".gitignore"
      - "scripts/setup-release-signing.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-infoset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test InfoSET shell and mailbox
        run: |
          chmod +x gradlew
          ./gradlew testGithubDebugUnitTest \
            --tests me.rerere.rikkahub.ui.context.NavigatorTest \
            --tests me.rerere.rikkahub.data.ai.tools.local.MailboxToolTest \
            --tests me.rerere.rikkahub.data.gifts.DelayedBoxImporterTest \
            --tests me.rerere.rikkahub.data.gifts.MonthlyLifeLettersImporterTest \
            --tests me.rerere.rikkahub.ui.pages.setting.SettingCatalogTest \
            --tests me.rerere.rikkahub.ui.pages.setting.InfoOsSettingsTest \
            --tests me.rerere.rikkahub.ui.components.message.tools.MailboxToolUITest
          ./gradlew assembleGithubDebugAndroidTest

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfoSET-0.1.0-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 3

