name: Bootstrap InfoSET

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-infoset.yml"
      - ".bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble bootstrap patch
        run: |
          test -f .bootstrap/part-00.patch
          test -f .bootstrap/part-01.patch
          test -f .bootstrap/part-02.patch
          test -f .bootstrap/part-03.patch
          cat .bootstrap/part-*.patch > /tmp/infoset-bootstrap.patch

      - name: Import fixed upstream and apply InfoSET changes
        run: |
          git clone --no-tags https://github.com/rikkahub/rikkahub.git /tmp/rikkahub
          git -C /tmp/rikkahub checkout 1fb09152942a0f3ae46bf796fe17eeaf2b022f19

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git /tmp/rikkahub/ ./

          git config user.name "InfoSET Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: import RikkaHub 1fb09152942a"
          git am /tmp/infoset-bootstrap.patch
          git push origin HEAD:main

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: |
          chmod +x gradlew
          ./gradlew test assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfoSET-0.1.0-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
