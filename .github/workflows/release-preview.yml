name: Publish InfoSET Preview

on:
  workflow_run:
    workflows: ["Build InfoSET"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    # Pull-request builds intentionally skip the APK artifact. Successful main
    # builds may arrive from a push or an explicit trusted workflow dispatch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-preview.1
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download APK from successful build
        run: |
          mkdir artifact
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name InfoSET-signed-preview \
            --dir artifact

      - name: Prepare release asset
        run: |
          apk_path="$(find artifact -type f -name '*universal*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" InfoSET-0.1.0-preview.apk

      - name: Publish GitHub prerelease
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$RELEASE_TAG" \
              InfoSET-0.1.0-preview-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --yes >/dev/null 2>&1 || true
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" \
                InfoSET-0.1.0-preview.apk \
                --repo "$GITHUB_REPOSITORY" \
                --clobber; then
                gh release edit "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --target "$HEAD_SHA" \
                  --title "InfoSET 0.1.0 Preview" \
                  --notes "Permanently signed rolling InfoSET preview. Package: com.infoset.app. Later previews install in place without clearing app data."
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            exit 1
          else
            gh release create "$RELEASE_TAG" \
              InfoSET-0.1.0-preview.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$HEAD_SHA" \
              --title "InfoSET 0.1.0 Preview" \
              --prerelease \
              --notes "Permanently signed rolling InfoSET preview. Package: com.infoset.app. Later previews install in place without clearing app data."
          fi
